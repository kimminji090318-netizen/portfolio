<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>영어 본문 트레이너</title>
<style>
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  font-family:'Malgun Gothic',sans-serif;max-width:820px;margin:15px auto;
  background:#f8fafc;color:#222;padding:0 10px 30px 10px;
}
.card{background:#fff;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.1);overflow:hidden;margin-bottom:20px}
header{background:#4f46e5;color:#fff;padding:16px;text-align:center}
header h2{margin:0;font-size:1.3rem;word-break:keep-all}

.row{
  display:flex;flex-wrap:nowrap;gap:6px;padding:10px;border-bottom:1px solid #e2e8f0;
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;
}
.row::-webkit-scrollbar{height:5px}
.row::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px}

button{
  border:1px solid #cbd5e1;background:#fff;padding:8px 12px;border-radius:6px;
  cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;min-height:40px;flex-shrink:0;
  transition:background .12s ease, transform .08s ease, box-shadow .12s ease;
}
button:hover{background:#f1f5f9}
button:active{
  transform:scale(0.94);
  background:#c7d2fe !important;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.15);
}
button.flash{
  background:#4f46e5 !important;
  color:#fff !important;
}

button.active{background:#4f46e5;color:#fff;border-color:#4f46e5}
.lvl-easy.active{background:#fbbf24;color:#000;border-color:#f59e0b}
.lvl-mid.active{background:#fb923c;color:#000;border-color:#ea580c}
.lvl-hard.active{background:#ef4444;color:#fff;border-color:#b91c1c}

#content{padding:20px;line-height:2.1;font-size:16px;min-height:150px;word-break:keep-all;overflow-wrap:break-word}
.blank{border:2px solid #94a3b8;border-radius:4px;text-align:center;font-size:15px;width:auto;min-width:60px;max-width:120px;padding:2px 4px;display:inline-block}
.blank:focus{border-color:#4f46e5;outline:none}
.blank.ok{background:#dcfce7;border-color:#16a34a}
.blank.no{background:#fee2e2;border-color:#dc2626}
.qbox{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;margin-bottom:12px}
.qbox label{display:block;margin:6px 0;cursor:pointer;line-height:1.5}
.qbox.ok{border-color:#16a34a;background:#f0fdf4}
.qbox.no{border-color:#dc2626;background:#fef2f2}

.bottom{
  display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;
  padding:12px 18px;background:#f1f5f9;border-top:1px solid #cbd5e1;
}
.bottom>div{display:flex;flex-wrap:wrap;gap:6px}
.guide{display:none;margin:0 0 18px;padding:10px;background:#eff6ff;border-left:4px solid #4f46e5;font-size:14px;word-break:keep-all}
#score{font-weight:bold;color:#4f46e5;white-space:nowrap}

.nav-btns{display:flex;gap:8px}
.prev-btn{background:#6366f1;color:#fff;border-color:#4338ca;font-size:14px;padding:10px 16px}
.prev-btn:hover{background:#4f46e5}
.next-btn{background:#16a34a;color:#fff;border-color:#15803d;font-size:14px;padding:10px 16px}
.next-btn:hover{background:#15803d}

@media (max-width:600px){
  body{margin:0 auto;padding:0 6px 30px 6px}
  header h2{font-size:1.05rem}
  .row{padding:6px;gap:4px}
  button{padding:7px 10px;font-size:12px;min-height:38px}
  #content{padding:14px;font-size:15px;line-height:2}
  .blank{min-width:50px;max-width:90px;font-size:14px;padding:1px 3px}
  .bottom{flex-direction:column;align-items:stretch;padding:10px 12px}
  .bottom>div{justify-content:center}
  #score{text-align:center}
  .guide{font-size:13px;padding:8px}
  .nav-btns{width:100%}
  .prev-btn,.next-btn{flex:1;font-size:14px;padding:12px}
}
@media (max-width:380px){
  header h2{font-size:0.95rem}
  button{font-size:11px;padding:6px 8px}
  #content{font-size:14px}
  .blank{min-width:44px;max-width:75px;font-size:13px}
}
</style>
</head>
<body>
<div class="card">
<header><h2>📖 영어 본문 완전정복 트레이너</h2></header>

<div class="row" id="unitTabs"></div>
<div class="row" id="paraTabs"></div>
<div class="row" id="modeTabs"></div>
<div class="row" id="levelTabs"></div>

<div id="content"></div>
<div class="guide" id="guide"></div>

<div class="bottom">
  <div>
    <button onclick="checkAnswer(this)">✅ 채점하기</button>
    <button onclick="toggleGuide(this)">💡 정답 보기/숨기기</button>
    <button onclick="reshuffle(this)">🔀 다시 풀기(새로 섞기)</button>
  </div>
  <div class="nav-btns">
    <button class="prev-btn" onclick="prevQuestion(this)">⬅️ 이전 문제</button>
    <button class="next-btn" onclick="nextQuestion(this)">➡️ 다음 문제</button>
  </div>
  <div id="score"></div>
</div>
</div>

<script>

let curUnit=0,curPara=0,curMode="read",curLevel="easy";
const BLANK_RATIO={easy:0.15,mid:0.3,hard:0.45};

function flashButton(btn){
  if(!btn) return;
  btn.classList.add("flash");
  setTimeout(()=>btn.classList.remove("flash"), 200);
}

function init(){
  document.getElementById("unitTabs").innerHTML=UNITS.map((u,i)=>
    `<button class="${i==curUnit?'active':''}" onclick="setUnit(${i},this)">${u.name}</button>`).join("");
  renderParaTabs();
  document.getElementById("modeTabs").innerHTML=`
    <button class="${curMode=='read'?'active':''}" onclick="setMode('read',this)">📖 전체 읽기</button>
    <button class="${curMode=='blank'?'active':''}" onclick="setMode('blank',this)">✏️ 빈칸 채우기</button>
    <button class="${curMode=='quiz'?'active':''}" onclick="setMode('quiz',this)">❓ 객관식 풀기</button>`;
  renderLevelTabs();
  render();
}
function renderParaTabs(){
  const paras=UNITS[curUnit].paras;
  document.getElementById("paraTabs").innerHTML=paras.map((p,i)=>
    `<button class="${i==curPara?'active':''}" onclick="setPara(${i},this)">문단 ${i+1}</button>`).join("");
}
function renderLevelTabs(){
  const box=document.getElementById("levelTabs");
  if(curMode!="blank"){box.innerHTML="";return;}
  box.innerHTML=`
    <button class="lvl-easy ${curLevel=='easy'?'active':''}" onclick="setLevel('easy',this)">쉬움</button>
    <button class="lvl-mid ${curLevel=='mid'?'active':''}" onclick="setLevel('mid',this)">보통</button>
    <button class="lvl-hard ${curLevel=='hard'?'active':''}" onclick="setLevel('hard',this)">어려움</button>`;
}
function setUnit(i,btn){curUnit=i;curPara=0;flashButton(btn);init();}
function setPara(i,btn){curPara=i;flashButton(btn);render();renderParaTabs();}
function setMode(m,btn){curMode=m;flashButton(btn);renderLevelTabs();render();}
function setLevel(l,btn){curLevel=l;flashButton(btn);renderLevelTabs();render();}
function reshuffle(btn){flashButton(btn);render();}

function nextQuestion(btn){
  flashButton(btn);
  const paras=UNITS[curUnit].paras;
  curPara = (curPara + 1) % paras.length;
  init();
}

function prevQuestion(btn){
  flashButton(btn);
  const paras=UNITS[curUnit].paras;
  curPara = (curPara - 1 + paras.length) % paras.length;
  init();
}

function render(){
  document.getElementById("score").innerText="";
  document.getElementById("guide").style.display="none";
  const para=UNITS[curUnit].paras[curPara];

  if(curMode=="read"){
    document.getElementById("content").innerHTML=`<p>${para.text}</p>`;
    document.getElementById("guide").innerText="정답 보기: 본문을 참고하세요.";
  }
  else if(curMode=="blank"){
    renderBlank(para.text);
  }
  else if(curMode=="quiz"){
    renderQuiz(para.quizzes);
  }
}

function renderBlank(text){
  const words=text.split(" ");
  const ratio=BLANK_RATIO[curLevel];
  const candidates=words.map((w,i)=>({w,i})).filter(o=>o.w.replace(/[.,]/g,"").length>4);
  const count=Math.max(3,Math.round(candidates.length*ratio));
  const shuffled=[...candidates].sort(()=>Math.random()-0.5).slice(0,count).sort((a,b)=>a.i-b.i);
  const blankIdx=shuffled.map(o=>o.i);

  let html="",answerList=[];
  words.forEach((w,i)=>{
    if(blankIdx.includes(i)){
      const clean=w.replace(/[.,]/g,"");
      const punct=w.replace(clean,"");
      answerList.push(clean.toLowerCase());
      html+=`<input class="blank" data-ans="${clean.toLowerCase()}" maxlength="${clean.length+3}">${punct} `;
    } else {
      html+=w+" ";
    }
  });
  document.getElementById("content").innerHTML=`<p>${html}</p>`;
  document.getElementById("guide").innerText="정답: "+answerList.join(", ");
  attachBlankKeyNav();
}

function attachBlankKeyNav(){
  const inputs=Array.from(document.querySelectorAll(".blank"));
  inputs.forEach((inp,idx)=>{
    inp.addEventListener("keydown", e=>{
      if(e.key==="Enter" || e.key==="Tab"){
        e.preventDefault();
        const next=inputs[idx+1];
        if(next) next.focus();
        else inp.blur();
      }
    });
  });
  if(inputs[0]) inputs[0].focus();
}

// ===== 여러 문제 중 무작위로 1개 선택하여 출제 =====
function renderQuiz(quizzes){
  const quiz = quizzes[Math.floor(Math.random()*quizzes.length)];
  const withFlag=quiz.opts.map((o,i)=>({text:o, isAnswer:i===quiz.ans}));
  const shuffled=[...withFlag].sort(()=>Math.random()-0.5);

  let html=`<div class="qbox" id="qbox"><p><b>${quiz.q}</b></p>`;
  shuffled.forEach((o,i)=>{
    html+=`<label><input type="radio" name="quiz" value="${i}" data-correct="${o.isAnswer}"> ${i+1}. ${o.text}</label>`;
  });
  html+="</div>";
  document.getElementById("content").innerHTML=html;

  const correctIdx=shuffled.findIndex(o=>o.isAnswer);
  document.getElementById("guide").innerText="정답: "+(correctIdx+1)+"번 - "+shuffled[correctIdx].text;
}

function checkAnswer(btn){
  flashButton(btn);
  if(curMode=="blank"){
    const inputs=document.querySelectorAll(".blank");
    let correct=0;
    inputs.forEach(inp=>{
      const val=inp.value.trim().toLowerCase();
      const ans=inp.dataset.ans;
      if(val===ans){inp.classList.add("ok");inp.classList.remove("no");correct++;}
      else{inp.classList.add("no");inp.classList.remove("ok");}
    });
    document.getElementById("score").innerText=`점수: ${correct} / ${inputs.length}`;
  }
  else if(curMode=="quiz"){
    const sel=document.querySelector('input[name="quiz"]:checked');
    const box=document.getElementById("qbox");
    if(!sel){alert("답을 선택하세요.");return;}
    const isCorrect=sel.dataset.correct==="true";
    if(isCorrect){box.classList.add("ok");document.getElementById("score").innerText="정답입니다! 🎉";}
    else{box.classList.add("no");document.getElementById("score").innerText="오답입니다. 다시 확인해보세요.";}
  }
  else{
    alert("전체 읽기 모드에서는 채점 기능이 없습니다. 빈칸 채우기 또는 객관식 풀기 모드를 이용하세요.");
  }
}

function toggleGuide(btn){
  flashButton(btn);
  const g=document.getElementById("guide");
  g.style.display=(g.style.display=="none"||g.style.display=="")?"block":"none";
}

init();
</script>
